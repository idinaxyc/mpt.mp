<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0d0f14" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>mpt.mp</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icon-192.png" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="top">
    <div class="brand"><span>mpt</span><em>.mp</em></div>
    <div class="device" id="device">подключение…</div>
  </header>

  <div class="searchbar">
    <input id="search" type="search" placeholder="Поиск: трек, исполнитель, альбом" autocomplete="off" />
  </div>

  <nav class="chips" id="chips"></nav>

  <main id="list" class="list"></main>

  <div class="empty" id="empty" hidden>
    <div class="empty-icon">♪</div>
    <h2>Библиотека пуста</h2>
    <p>Добавь папку с музыкой на компьютере — треки появятся здесь.</p>
  </div>

  <footer class="player" id="player">
    <div class="progress-row">
      <span id="pos">0:00</span>
      <input id="seek" type="range" min="0" max="1000" value="0" step="1" />
      <span id="dur">0:00</span>
    </div>
    <div class="controls">
      <button id="prev" class="icon" aria-label="Назад">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true">
          <path d="M6 5h2.2v14H6zM20 5v14L9.2 12z" />
        </svg>
      </button>
      <button id="play" class="play" aria-label="Играть">
        <svg viewBox="0 0 24 24" width="21" height="21" fill="currentColor" aria-hidden="true">
          <path d="M8 5v14l11-7z" />
        </svg>
      </button>
      <button id="next" class="icon" aria-label="Вперёд">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true">
          <path d="M15.8 5H18v14h-2.2zM4 5v14l10.8-7z" />
        </svg>
      </button>
      <div class="now" id="now">
        <div class="now-title">Ничего не играет</div>
        <div class="now-sub">Выбери трек</div>
      </div>
      <a id="download" class="icon dl" hidden aria-label="Скачать" title="Скачать на телефон">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">
          <path d="M11 4h2v8.2l2.9-2.9 1.4 1.4L12 16.1 6.7 10.7l1.4-1.4L11 12.2z" />
          <path d="M5 18h14v2H5z" />
        </svg>
      </a>
    </div>
    <div class="upload-row">
      <label class="upload">
        Загрузить с телефона
        <input id="upload" type="file" accept="audio/*" multiple hidden />
      </label>
      <span id="upload-status" class="upload-status"></span>
    </div>
  </footer>

  <audio id="audio" preload="metadata"></audio>
  <script src="/app.js"></script>
</body>
</html>
