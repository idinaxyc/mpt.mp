name: Build and publish release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            archive: mpt-mp-linux-x86_64.tar.gz
          - os: windows-latest
            archive: mpt-mp-windows-x86_64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux audio build dependency
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Run Rust tests
        run: cargo test --locked -- --test-threads=1

      - name: Build release binary
        run: cargo build --locked --release

      - name: Package Linux build
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p package
          cp target/release/mpt-mp package/mpt-mp
          if [ -d plugins ]; then cp -R plugins package/plugins; fi
          for f in README.md plugins.md LICENSE; do
            if [ -f "$f" ]; then cp "$f" package/; fi
          done
          tar -czf "${{ matrix.archive }}" -C package .

      - name: Package Windows build
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item target/release/mpt-mp.exe package/mpt-mp.exe
          if (Test-Path plugins) { Copy-Item plugins package/plugins -Recurse }
          foreach ($file in @('README.md', 'plugins.md', 'LICENSE')) {
            if (Test-Path $file) { Copy-Item $file package/ }
          }
          Compress-Archive -Path package/* -DestinationPath "${{ matrix.archive }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
