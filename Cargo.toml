[package]
name = "mpt-mp"
version = "0.1.0"
edition = "2021"
description = "mpt.mp — лёгкий модульный музыкальный плеер"
license = "MIT"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
dirs = "5"
lofty = "0.21"
# Интерфейс. "smol" нужен для iced::time::every (таймер), tiny-skia — программный рендер без wgpu (легче).
iced = { version = "0.13", default-features = false, features = ["tiny-skia", "image", "smol"] }
# m4a/aac: без этих фич Decoder не понимает контейнер MP4, хотя m4a есть в AUDIO_EXTS.
# Все форматы через symphonia: FLAC-декодер claxon из набора по умолчанию не умеет перематывать
# (NotSupported), а symphonia умеет. Заодно из сборки уходят claxon, lewton и hound.
rodio = { version = "0.20", default-features = false, features = [
    "symphonia-aac", "symphonia-flac", "symphonia-isomp4",
    "symphonia-mp3", "symphonia-vorbis", "symphonia-wav",
] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
sha2 = "0.10"
hex = "0.4"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

[[bin]]
name = "mpt-mp"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
