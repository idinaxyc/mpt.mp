name: Build and publish release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            archive: mpt-mp-linux-x86_64.tar.gz
          - os: windows-latest
            archive: mpt-mp-windows-x86_64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract source archive
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          archive = Path("mpt-mp-alpha.zip")
          if not archive.exists():
              raise SystemExit("mpt-mp-alpha.zip is missing from the repository")
          with ZipFile(archive) as z:
              names = z.namelist()
              cargo = next((n for n in names if n.rstrip("/").endswith("Cargo.toml")), None)
              if cargo is None:
                  raise SystemExit("Cargo.toml was not found inside mpt-mp-alpha.zip")
              prefix = cargo.rsplit("/", 1)[0] + "/" if "/" in cargo else ""
              excluded = {"target", "data", "plugin-data", "synced", "imports", "exports", "debug", ".git"}
              out = Path("source")
              out.mkdir(exist_ok=True)
              for info in z.infolist():
                  name = info.filename
                  if not name.startswith(prefix):
                      continue
                  rel = name[len(prefix):].rstrip("/")
                  if not rel or rel.split("/", 1)[0] in excluded:
                      continue
                  if rel in {"mpt.mp", ".rustc_info.json"} or rel.endswith("/.rustc_info.json"):
                      continue
                  dest = (out / rel).resolve()
                  if out.resolve() not in dest.parents and dest != out.resolve():
                      raise SystemExit(f"Unsafe archive path: {name}")
                  if info.is_dir():
                      dest.mkdir(parents=True, exist_ok=True)
                  else:
                      dest.parent.mkdir(parents=True, exist_ok=True)
                      dest.write_bytes(z.read(info))
          if not Path("source/Cargo.toml").exists():
              raise SystemExit("Source extraction did not produce source/Cargo.toml")
          PY

      - name: Install Linux audio build dependency
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: source -> target

      - name: Run Rust tests
        working-directory: source
        run: cargo test --locked -- --test-threads=1

      - name: Build release binary
        working-directory: source
        run: cargo build --locked --release

      - name: Package Linux build
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p package
          cp source/target/release/mpt-mp package/mpt-mp
          if [ -d source/plugins ]; then cp -R source/plugins package/plugins; fi
          for f in README.md plugins.md LICENSE; do
            if [ -f "source/$f" ]; then cp "source/$f" package/; fi
          done
          tar -czf "${{ matrix.archive }}" -C package .

      - name: Package Windows build
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item source/target/release/mpt-mp.exe package/mpt-mp.exe
          if (Test-Path source/plugins) { Copy-Item source/plugins package/plugins -Recurse }
          foreach ($file in @('README.md', 'plugins.md', 'LICENSE')) {
            if (Test-Path "source/$file") { Copy-Item "source/$file" package/ }
          }
          Compress-Archive -Path package/* -DestinationPath "${{ matrix.archive }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
